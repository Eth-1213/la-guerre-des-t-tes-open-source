<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1b2440;color:#fff;font:12px sans-serif;padding:8px}
canvas{margin:2px;vertical-align:top;background:#000}h3{margin:10px 0 4px;font-size:13px}
</style></head><body>
<h3>1. Ce que filme la caméra frontale à chaque étape (flux brut, non inversé)</h3><div id="flux"></div>
<h3>2. Tête reconstruite, tour complet</h3><div id="tour"></div>
<script type="module">
import { cropFromVideo } from '/src/faces.js';
import { buildEquirect, buildAtlas, tileFor, SCAN_STEPS } from '/src/head3d.js';

// Sujet asymétrique : grain de beauté sur SA joue droite, boucle d'oreille à SA gauche.
const REPERES = [
  { lon: 0,     lat: -0.02, r: .10, c: '#d23b2f', nom: 'nez' },
  { lon: 0.62,  lat: 0.02,  r: .09, c: '#22aa44', nom: 'grain (joue DROITE du sujet)' },
  { lon: -0.62, lat: 0.02,  r: .05, c: '#2255dd', nom: 'petit point (joue GAUCHE)' },
  { lon: -1.45, lat: -0.1,  r: .07, c: '#ffcc22', nom: 'boucle (oreille GAUCHE)' },
  { lon: 0,     lat: 0.5,   r: .12, c: '#7a4a2b', nom: 'frange' },
  { lon: 0,     lat: -0.45, r: .08, c: '#8c3b3b', nom: 'bouche' },
];
const dir=(lo,la)=>({x:Math.sin(lo)*Math.cos(la),y:Math.sin(la),z:-Math.cos(lo)*Math.cos(la)});
const croix=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const norm=v=>{const l=Math.hypot(v.x,v.y,v.z)||1;return{x:v.x/l,y:v.y/l,z:v.z/l};};

// Image telle que le capteur frontal la livre : le sujet a tourné la tête,
// le téléphone n'a pas bougé. Orientation photo (pas miroir).
function fluxCamera(lon, lat) {
  const W = 640, H = 480;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#20242e'; ctx.fillRect(0, 0, W, H);           // la pièce
  const d = dir(lon, lat), f = {x:-d.x,y:-d.y,z:-d.z};
  const r = norm(croix(f,{x:0,y:1,z:0})), u = croix(r,f);
  const cx = W/2, cy = H/2, R = H*0.37*0.74/0.78*0.78;            // tête dans le gabarit
  const Rx = (H*0.78/2)*0.74, Ry = (H*0.78/2)*0.94;
  ctx.fillStyle = '#c99a72'; ctx.beginPath();
  ctx.ellipse(cx, cy, Rx, Ry, 0, 0, 7); ctx.fill();
  for (const m of REPERES) {
    const n = dir(m.lon, m.lat);
    if (n.x*d.x + n.y*d.y + n.z*d.z <= 0.08) continue;
    const sx = n.x*r.x + n.y*r.y + n.z*r.z, sy = n.x*u.x + n.y*u.y + n.z*u.z;
    ctx.fillStyle = m.c; ctx.beginPath();
    ctx.ellipse(cx + sx*Rx, cy - sy*Ry, R*m.r, R*m.r, 0, 0, 7); ctx.fill();
  }
  void R;
  return c;
}

const vues = SCAN_STEPS.map(s => ({
  image: cropFromVideo(fluxCamera(s.lon, s.lat), 480, 480),   // <- vrai chemin de capture
  lon: s.lon, lat: s.lat,
}));
const bacF = document.getElementById('flux');
vues.forEach((v, i) => {
  const c = document.createElement('canvas'); c.width = c.height = 92;
  c.getContext('2d').drawImage(v.image, 0, 0, 92, 92);
  const w = document.createElement('span'); w.style.display = 'inline-block';
  w.appendChild(c);
  w.appendChild(Object.assign(document.createElement('div'), { textContent: SCAN_STEPS[i].titre, style: 'width:96px;text-align:center' }));
  bacF.appendChild(w);
});

const atlas = buildAtlas(buildEquirect(vues));
const bacT = document.getElementById('tour');
for (let i = 0; i < 12; i++) {
  const lon = (i/12)*Math.PI*2 - Math.PI;
  const t = tileFor(atlas, lon, 0);
  const c = document.createElement('canvas'); c.width = 92; c.height = 103;
  c.getContext('2d').drawImage(atlas.canvas, t.sx, t.sy, t.size, t.size, 0, 0, 92, 103);
  bacT.appendChild(c);
}

// Contrôle chiffré : chaque repère doit réapparaître au bon endroit.
const tc = document.createElement('canvas'); tc.width = tc.height = atlas.tile;
const tctx = tc.getContext('2d', { willReadFrequently: true });
const snap = (vlon) => { let yi = Math.round((((vlon+Math.PI)%(Math.PI*2))/(Math.PI*2))*atlas.yawN)%atlas.yawN; if(yi<0)yi+=atlas.yawN; return (yi/atlas.yawN)*Math.PI*2-Math.PI; };
function couleurA(lon, lat, vlon) {
  const sv = snap(vlon), t = tileFor(atlas, sv, 0);
  tctx.clearRect(0,0,atlas.tile,atlas.tile);
  tctx.drawImage(atlas.canvas, t.sx, t.sy, t.size, t.size, 0, 0, atlas.tile, atlas.tile);
  const d = dir(lon, lat), dv = dir(sv, 0), f = {x:-dv.x,y:-dv.y,z:-dv.z};
  const r = norm(croix(f,{x:0,y:1,z:0})), u = croix(r,f);
  const sx = d.x*r.x+d.y*r.y+d.z*r.z, sy = d.x*u.x+d.y*u.y+d.z*u.z;
  const px = Math.round((0.5+sx*0.47)*atlas.tile), py = Math.round((0.5-sy*0.47)*atlas.tile);
  const p = tctx.getImageData(px, py, 1, 1).data;
  return [p[0], p[1], p[2]];
}
const dom = v => v.indexOf(Math.max(...v));
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
window.RESULTAT = REPERES.map(m => {
  const obtenu = couleurA(m.lon, m.lat, m.lon);
  return { repere: m.nom, ok: dom(obtenu) === dom(hex(m.c)), obtenu: `rgb(${obtenu})`, attendu: m.c };
});
</script></body></html>
