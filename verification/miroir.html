<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { cropFromVideo } from '/src/faces.js';
// Image brute telle que la livre une caméra frontale : NON inversée.
// On y place une marque bien à gauche (la joue droite du sujet s'y trouve).
const faux = document.createElement('canvas');
faux.width = 640; faux.height = 480;
const c = faux.getContext('2d');
c.fillStyle = '#808080'; c.fillRect(0, 0, 640, 480);
c.fillStyle = '#ff0000'; c.fillRect(150, 180, 60, 120);   // marque à GAUCHE de l'image
c.fillStyle = '#0000ff'; c.fillRect(430, 180, 60, 120);   // marque à DROITE de l'image

// Balayage de la ligne médiane : où atterrissent les deux marques ?
const positions = (crop) => {
  const ctx = crop.getContext('2d');
  const ligne = ctx.getImageData(0, Math.round(crop.height * 0.5), crop.width, 1).data;
  const trouve = (test) => {
    const xs = [];
    for (let x = 0; x < crop.width; x++) {
      const p = x * 4;
      if (test(ligne[p], ligne[p + 1], ligne[p + 2])) xs.push(x);
    }
    return xs.length ? Math.round((xs[0] + xs[xs.length - 1]) / 2 / crop.width * 100) + '%' : 'absente';
  };
  return { rouge: trouve((r, g, b) => r > 150 && b < 100), bleu: trouve((r, g, b) => b > 150 && r < 100) };
};
// Le gabarit est un carré centré : on cadre large pour retrouver les deux marques.
const cropMiroir = cropFromVideo(faux, 480, 480, true);
const cropDirect = cropFromVideo(faux, 480, 480, false);
window.RESULTAT = {
  brut: { rouge: '23%', bleu: '72%' },
  avecMiroir: positions(cropMiroir),
  sansMiroir: positions(cropDirect),
};
</script></body></html>
