<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import { buildEquirect, buildAtlas, SCAN_STEPS, tileFor } from '/src/head3d.js';
const MARQUES = [
  { lon: 0,       lat: 0,    r: .34, c: [224,32,32],  nom: 'nez' },
  { lon: -0.6,    lat: 0,    r: .30, c: [32,80,224],  nom: 'joue gauche (lon-)' },
  { lon: 0.6,     lat: 0,    r: .30, c: [32,176,80],  nom: 'joue droite (lon+)' },
  { lon: 0,       lat: .62,  r: .34, c: [224,192,32], nom: 'front' },
  { lon: 0,       lat: -.6,  r: .30, c: [176,96,208], nom: 'menton' },
];
const dir=(lo,la)=>({x:Math.sin(lo)*Math.cos(la),y:Math.sin(la),z:-Math.cos(lo)*Math.cos(la)});
const croix=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const norm=v=>{const l=Math.hypot(v.x,v.y,v.z)||1;return{x:v.x/l,y:v.y/l,z:v.z/l};};
function photo(lon,lat,t=192){
  const c=document.createElement('canvas');c.width=c.height=t;const ctx=c.getContext('2d');
  ctx.fillStyle='#101010';ctx.fillRect(0,0,t,t);                    // décor très sombre : toute bavure se verra
  const d=dir(lon,lat),f={x:-d.x,y:-d.y,z:-d.z};
  const r=norm(croix(f,{x:0,y:1,z:0})),u=croix(r,f);
  ctx.fillStyle='#c99a72';ctx.beginPath();
  ctx.ellipse(t/2,t/2,t*.37*.74,t*.37*.94,0,0,7);ctx.fill();
  for(const m of MARQUES){const n=dir(m.lon,m.lat);
    if(n.x*d.x+n.y*d.y+n.z*d.z<=.05)continue;
    const sx=n.x*r.x+n.y*r.y+n.z*r.z,sy=n.x*u.x+n.y*u.y+n.z*u.z;
    ctx.fillStyle=`rgb(${m.c})`;ctx.beginPath();
    ctx.ellipse((.5+sx*.74/2)*t,(.5-sy*.94/2)*t,t*m.r*.16,t*m.r*.16,0,0,7);ctx.fill();}
  return c;
}
const vues=SCAN_STEPS.map(s=>({image:photo(s.lon,s.lat),lon:s.lon,lat:s.lat}));
const atlas=buildAtlas(buildEquirect(vues));
const tc=document.createElement('canvas');tc.width=tc.height=atlas.tile;
const tctx=tc.getContext('2d',{willReadFrequently:true});
function echantillon(lon,lat,fx,fy){
  const t=tileFor(atlas,lon,lat);
  tctx.clearRect(0,0,atlas.tile,atlas.tile);
  tctx.drawImage(atlas.canvas,t.sx,t.sy,t.size,t.size,0,0,atlas.tile,atlas.tile);
  const d=tctx.getImageData(Math.round(fx*atlas.tile),Math.round(fy*atlas.tile),1,1).data;
  return [d[0],d[1],d[2]];
}
const proche=(a,b)=>{ // teinte dominante identique ?
  const dom=v=>v.indexOf(Math.max(...v));
  return dom(a)===dom(b) && Math.max(...a)>60;
};
const M=Object.fromEntries(MARQUES.map(m=>[m.nom,m.c]));
// Un point (lon, lat) vu depuis (vlon, vlat) tombe à ces coordonnées de tuile.
const place=(lon,lat,vlon=0,vlat=0)=>{
  const n=dir(lon,lat),d=dir(vlon,vlat),f={x:-d.x,y:-d.y,z:-d.z};
  const r=norm(croix(f,{x:0,y:1,z:0})),u=croix(r,f);
  return {fx:.5+(n.x*r.x+n.y*r.y+n.z*r.z)*.47, fy:.5-(n.x*u.x+n.y*u.y+n.z*u.z)*.47};
};
// L'atlas quantifie les angles : on calcule la position dans la tuile
// réellement choisie, pas dans une vue idéale.
const snap=(vlon,vlat)=>{
  let yi=Math.round((((vlon+Math.PI)%(Math.PI*2))/(Math.PI*2))*atlas.yawN)%atlas.yawN;
  if(yi<0)yi+=atlas.yawN;
  const pj=Math.round(((Math.max(-atlas.pitchMax,Math.min(atlas.pitchMax,vlat))+atlas.pitchMax)/(2*atlas.pitchMax))*(atlas.pitchN-1));
  return { lon:(yi/atlas.yawN)*Math.PI*2-Math.PI, lat:-atlas.pitchMax+(pj/(atlas.pitchN-1))*2*atlas.pitchMax };
};
const ech=(lon,lat,vlon=0,vlat=0)=>{
  const s=snap(vlon,vlat);
  const p=place(lon,lat,s.lon,s.lat);
  return echantillon(vlon,vlat,p.fx,p.fy);
};
const tests=[
  ['Vue de face : le nez au centre',                 ech(0,0),          M['nez']],
  ['Vue de face : joue droite à gauche de l\'image', ech(.6,0),         M['joue droite (lon+)']],
  ['Vue de face : joue gauche à droite de l\'image', ech(-.6,0),        M['joue gauche (lon-)']],
  ['Vue de face : le front en haut',                 ech(0,.62),        M['front']],
  ['Vue de face : le menton en bas',                 ech(0,-.6),        M['menton']],
  ['Vue du côté droit : joue droite au centre',      ech(.6,0,.6,0),    M['joue droite (lon+)']],
  ['Vue du côté gauche : joue gauche au centre',     ech(-.6,0,-.6,0),  M['joue gauche (lon-)']],
  ['Vue du côté droit : le nez sur le bord',         ech(0,0,.6,0),     M['nez']],
  ['Vue plongeante : le front reste en haut',        ech(0,.62,0,.42),  M['front']],
];
window.RESULTAT = tests.map(([nom,obtenu,attendu])=>({
  test:nom, obtenu:`rgb(${obtenu})`, attendu:`rgb(${attendu})`, ok:proche(obtenu,attendu)
}));
</script></body></html>
