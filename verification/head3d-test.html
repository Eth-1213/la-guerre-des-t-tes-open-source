<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#222;color:#fff;font:12px sans-serif}
canvas{image-rendering:pixelated;margin:4px;background:#111;vertical-align:top}
h3{margin:8px 4px 2px;font-size:13px}
</style></head><body>
<h3>Vues synthétiques fournies au reconstructeur (nez rouge, joue G bleue, joue D verte, front jaune)</h3>
<div id="vues"></div>
<h3>Texture équirectangulaire reconstruite (longitude -180→180)</h3>
<canvas id="equi" width="320" height="160" style="width:640px;height:320px"></canvas>
<h3>Planche de sprites : la tête tournant sur 360° (rangée du milieu)</h3>
<div id="atlas"></div>
<script type="module">
import { buildEquirect, buildAtlas, SCAN_STEPS, tileFor, viewAngles } from '/src/head3d.js';

// Tête de référence : marques de couleur à des longitudes connues.
// On simule la photo prise sous chaque angle par une projection orthographique.
const MARQUES = [
  { lon: 0,      lat: 0,     r: 0.34, c: '#e02020', nom: 'nez' },
  { lon: -1.05,  lat: 0.05,  r: 0.3,  c: '#2050e0', nom: 'joue gauche' },   // -lon = côté gauche de la tête
  { lon: 1.05,   lat: 0.05,  r: 0.3,  c: '#20b050', nom: 'joue droite' },
  { lon: 0,      lat: 0.62,  r: 0.34, c: '#e0c020', nom: 'front' },
  { lon: 0,      lat: -0.6,  r: 0.3,  c: '#b060d0', nom: 'menton' },
  { lon: Math.PI, lat: 0.1,  r: 0.4,  c: '#804020', nom: 'nuque' },
];
const dir = (lon, lat) => ({ x: Math.sin(lon)*Math.cos(lat), y: Math.sin(lat), z: -Math.cos(lon)*Math.cos(lat) });
const croix = (a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
const norm = v => { const l=Math.hypot(v.x,v.y,v.z)||1; return {x:v.x/l,y:v.y/l,z:v.z/l}; };

function photo(lon, lat, taille = 192) {
  const c = document.createElement('canvas'); c.width = c.height = taille;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c99a72'; ctx.fillRect(0,0,taille,taille);          // fond « peau »
  const d = dir(lon, lat), f = {x:-d.x,y:-d.y,z:-d.z};
  const r = norm(croix(f,{x:0,y:1,z:0})), u = croix(r,f);
  // silhouette
  ctx.fillStyle = '#8a6448'; ctx.beginPath();
  ctx.ellipse(taille/2, taille/2, taille*0.39*0.78, taille*0.39*0.98, 0, 0, 7); ctx.fill();
  for (const m of MARQUES) {
    const n = dir(m.lon, m.lat);
    if (n.x*d.x + n.y*d.y + n.z*d.z <= 0.05) continue;                  // face cachée
    const sx = n.x*r.x + n.y*r.y + n.z*r.z, sy = n.x*u.x + n.y*u.y + n.z*u.z;
    const px = (0.5 + sx*0.78/2)*taille, py = (0.5 - sy*0.98/2)*taille;
    ctx.fillStyle = m.c; ctx.beginPath();
    ctx.ellipse(px, py, taille*m.r*0.18, taille*m.r*0.18, 0, 0, 7); ctx.fill();
  }
  return c;
}

const vues = SCAN_STEPS.map(s => ({ image: photo(s.lon, s.lat), lon: s.lon, lat: s.lat }));
const bac = document.getElementById('vues');
vues.forEach((v, i) => {
  const c = document.createElement('canvas'); c.width = c.height = 96;
  c.style.width = c.style.height = '96px';
  c.getContext('2d').drawImage(v.image, 0, 0, 96, 96);
  const w = document.createElement('span');
  w.appendChild(c);
  w.appendChild(Object.assign(document.createElement('div'), { textContent: SCAN_STEPS[i].titre, style: 'text-align:center;width:104px' }));
  w.style.display = 'inline-block';
  bac.appendChild(w);
});

const t0 = performance.now();
const equi = buildEquirect(vues);
const t1 = performance.now();
const atlas = buildAtlas(equi);
const t2 = performance.now();
document.getElementById('equi').getContext('2d').drawImage(equi, 0, 0);

const ab = document.getElementById('atlas');
for (let i = 0; i < atlas.yawN; i++) {
  const lon = (i / atlas.yawN) * Math.PI * 2 - Math.PI;
  const t = tileFor(atlas, lon, 0);
  const c = document.createElement('canvas'); c.width = c.height = atlas.tile;
  c.style.width = c.style.height = '80px';
  c.getContext('2d').drawImage(atlas.canvas, t.sx, t.sy, t.size, t.size, 0, 0, atlas.tile, atlas.tile);
  ab.appendChild(c);
}
window.RESULTAT = {
  msEquirect: +(t1 - t0).toFixed(1),
  msAtlas: +(t2 - t1).toFixed(1),
  atlas: `${atlas.canvas.width}x${atlas.canvas.height}`,
  // Contrôle : sous quel angle voit-on une tête dont le nez pointe au nord, vue depuis l'est ?
  depuisEst: viewAngles(0, 0, { x: 1, y: 0, z: 0 }),
  depuisDevant: viewAngles(0, 0, { x: 0, y: 0, z: -1 }),
};
</script></body></html>
